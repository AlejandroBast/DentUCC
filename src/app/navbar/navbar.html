<svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; overflow: hidden;">
  <filter id="liquid-glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"></feTurbulence>
    <feGaussianBlur in="noise" stdDeviation="2.5" result="blurredNoise"></feGaussianBlur>
    <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="28" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
</svg>
